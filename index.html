<title>Haunted Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@500;700&display=swap">
<style>
/* Layout: a full-bleed WebGL world; each player gets a HUD layer sized to their viewport; menus sit on top as road-sign panels. */
:root{
  color-scheme:dark;
  --asphalt:#15120e; --panel:rgba(17,22,27,.86); --panel-solid:#1a2229; --line:#34414c;
  --paper:#f3ecdc; --muted:#a3adb0;
  --sign:#3b1f4f; --sign-edge:#f3e6c8; --nps:#5a3a22; --nps-paper:#efe3c8;
  --marker:#ff8a1f; --p1:#ff6a48; --p2:#3fb2ff; --good:#5bd18a; --bad:#ff5c5c; --ink-ach:#2f5fb8; --ink-egg:#b8322f; --ink-land:#2f7d4f;
  --f-display:"IM Fell English SC",Georgia,"Times New Roman",serif;
  --f-ui:"Overpass","Segoe UI",system-ui,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--asphalt);color:var(--paper);overflow:hidden}
body{font:15px/1.35 var(--f-ui)}
#app{position:fixed;inset:0}
#gl{display:block;width:100%;height:100%;outline:none}
#divider{position:absolute;background:#0b0f13;pointer-events:none;z-index:3}
#hudlayer{position:absolute;inset:0;pointer-events:none;z-index:4}
.phud{position:absolute;overflow:hidden}
.phud .loc{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.phud .loc .rg{font:800 13px var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.phud .loc .pl{font:600 13px var(--f-ui);color:var(--muted)}
.phud .who{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.phud .money{position:absolute;right:14px;top:12px;font:700 20px var(--f-mono);color:var(--good);text-shadow:0 1px 3px rgba(0,0,0,.8);transition:transform .2s}
.phud .money.pop{transform:scale(1.18)}
.phud .obj{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:min(560px,calc(100% - 260px));display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 14px 7px 10px;font:600 15px var(--f-ui)}
.phud .obj .dm{flex:none;width:12px;height:12px;background:var(--marker);transform:rotate(45deg)}
.phud .obj .tm{font:700 15px var(--f-mono);color:var(--marker);margin-left:6px;font-variant-numeric:tabular-nums}
.phud .obj .tm.low{color:var(--bad)}
.phud .mini{position:absolute;left:14px;bottom:14px;width:176px;height:176px;border-radius:14px;border:2px solid rgba(243,236,220,.75);box-shadow:0 4px 16px rgba(0,0,0,.5)}
.phud .gauge{position:absolute;right:16px;bottom:14px;text-align:right;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.phud .gauge .spd{font:700 46px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.phud .gauge .spd i{font:600 13px var(--f-ui);font-style:normal;color:var(--muted);margin-left:4px;letter-spacing:.1em}
.phud .gauge .alt{font:600 14px var(--f-mono);color:var(--muted);margin-top:2px}
.phud .gauge .vn{font:800 12px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--paper);margin-top:4px}
.phud .gauge .hp{width:150px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin:6px 0 0 auto;overflow:hidden}
.phud .gauge .hp span{display:block;height:100%;background:var(--good);width:100%}
.phud .gauge .warn{font:800 12px var(--f-ui);color:var(--bad);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.phud .prompt{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 420px)}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font:600 14px var(--f-ui);white-space:nowrap}
.gl{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;font:800 12px var(--f-ui);color:#10140f;flex:none}
.gl.a{background:#5bd18a}.gl.b{background:#ff6b5c}.gl.x{background:#4aa3ff}.gl.y{background:#f6c431}
.gl.k{border-radius:5px;background:#e6e1d6;padding:0 6px;font-size:11px;min-width:16px}
.gl.t{border-radius:6px;background:#c9ced2;padding:0 5px}
.phud .hint{position:absolute;right:16px;bottom:140px;max-width:280px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;transition:opacity .5s}
.phud .hint .chip{font-size:13px}
.phud .arrow{position:absolute;width:0;height:0;pointer-events:none}
.phud .arrow .tri{position:absolute;left:-14px;top:-14px;width:28px;height:28px;background:var(--marker);clip-path:polygon(50% 0,100% 100%,50% 76%,0 100%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.phud .arrow .d{position:absolute;left:-30px;top:18px;width:60px;text-align:center;font:700 12px var(--f-mono);color:var(--marker);text-shadow:0 1px 3px #000}
.phud .banner{position:absolute;left:50%;top:64px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity .6s;pointer-events:none}
.phud .banner.show{opacity:1}
.sign{background:var(--sign);border-radius:10px;padding:5px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.sign>div{border:2.5px solid var(--sign-edge);border-radius:7px;padding:8px 22px 6px;font:800 26px/1.05 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-align:center}
.plate{background:#fff;color:#1d2a22;border-radius:5px;padding:3px 10px;font:600 13px var(--f-ui)}
.phud .toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font:600 14px var(--f-ui);opacity:0;transition:opacity .3s;max-width:calc(100% - 60px);text-align:center}
.phud .toast.show{opacity:1}
.phud .big{position:absolute;left:0;right:0;top:34%;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
.phud .big.show{opacity:1}
.phud .big h3{margin:0;font:400 clamp(26px,4vw,44px)/1 var(--f-display);color:var(--marker);text-shadow:0 3px 0 #000,0 0 20px rgba(0,0,0,.6);text-wrap:balance}
.phud .big p{margin:8px 0 0;font:600 16px var(--f-ui);text-shadow:0 1px 4px #000}
.phud .fact{position:absolute;left:14px;top:62px;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:400 13px/1.4 var(--f-ui);opacity:0;transition:opacity .5s;pointer-events:none}
.phud .fact.show{opacity:1}
.phud .fact b{display:block;font:800 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--marker);margin-bottom:3px}
.phud .card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 40px));background:var(--nps);color:var(--nps-paper);border-radius:12px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.6);pointer-events:auto}
.phud .card>div{border:2px solid var(--nps-paper);border-radius:8px;padding:16px 18px 14px}
.phud .card .yr{display:inline-block;font:700 12px var(--f-mono);border:1.5px solid var(--nps-paper);border-radius:4px;padding:1px 6px;margin-bottom:8px}
.phud .card h4{margin:0 0 8px;font:800 22px/1.1 var(--f-ui);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.phud .card p{margin:0;font:400 15px/1.5 var(--f-ui);max-width:62ch}
.phud .card .close{margin-top:12px;display:flex;justify-content:flex-end;gap:8px;font:600 13px var(--f-ui)}
.phud .card.secret{background:#3d2a5a}
#dialog{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(680px,calc(100% - 32px));background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:14px 18px 12px;z-index:6;box-shadow:0 14px 40px rgba(0,0,0,.55)}
#dialog .who{font:800 12px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--marker);margin-bottom:5px}
#dialog .txt{font:400 17px/1.45 var(--f-ui);max-width:62ch}
#dialog .opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#dialog .opt{padding:8px 12px;border-radius:8px;border:1px solid var(--line);font:600 15px var(--f-ui);cursor:pointer}
#dialog .opt.on{border-color:var(--marker);background:rgba(255,138,31,.12)}
#dialog .go{display:flex;justify-content:flex-end;margin-top:8px}
#stamps{position:absolute;right:16px;top:58px;display:flex;flex-direction:column;gap:10px;z-index:7;pointer-events:none;align-items:flex-end}
.stamp{width:290px;background:rgba(243,236,220,.96);color:#222;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:stampIn .5s cubic-bezier(.2,1.6,.4,1)}
.stamp .ink{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink-ach);display:grid;place-items:center;transform:rotate(-12deg);font:400 10px/1 var(--f-display);color:var(--ink-ach);text-align:center;padding:4px;box-sizing:border-box}
.stamp.egg .ink{border-color:var(--ink-egg);color:var(--ink-egg);border-style:dashed}
.stamp.land .ink{border-color:var(--ink-land);color:var(--ink-land);border-radius:10px}
.stamp .k{font:800 10px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:#6b6457}
.stamp .n{font:800 16px/1.15 var(--f-ui)}
.stamp .d{font:400 12px/1.35 var(--f-ui);color:#4a463f}
@keyframes stampIn{from{transform:scale(1.4) rotate(6deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
.overlay{position:absolute;inset:0;z-index:10;display:flex;background:rgba(10,14,18,.55);overflow:auto}
.overlay>*{margin:auto}
.overlay.clear{background:linear-gradient(180deg,rgba(10,14,18,.25),rgba(10,14,18,.75))}
.menu{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 16px;box-sizing:border-box;max-width:100%}
.logo{font:400 clamp(44px,9vw,104px)/.9 var(--f-display);color:var(--paper);text-align:center;letter-spacing:.02em;text-shadow:0 5px 0 #0b0f13}
.logo span{color:var(--marker)}
.tag{font:600 16px var(--f-ui);color:var(--muted);text-align:center;margin-top:-8px;letter-spacing:.04em}
.mlist{display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px))}
.mi{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sign);color:#fff;border:2px solid var(--sign-edge);border-radius:9px;padding:10px 16px;font:800 16px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-align:left;box-shadow:0 0 0 3px var(--sign)}
.mi:hover,.mi.on{box-shadow:0 0 0 3px var(--sign),0 0 0 6px var(--marker)}
.mi .v{font:700 13px var(--f-mono);text-transform:none;letter-spacing:0;color:#d9f0e2}
.mi.dim{background:#2a3540;box-shadow:0 0 0 3px #2a3540}
.mi.dim.on,.mi.dim:hover{box-shadow:0 0 0 3px #2a3540,0 0 0 6px var(--marker)}
.mi.danger{background:#6a2a22;box-shadow:0 0 0 3px #6a2a22}
.mi.danger.on{box-shadow:0 0 0 3px #6a2a22,0 0 0 6px var(--marker)}
.panel{background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;box-sizing:border-box}
.panel h2{margin:0 0 4px;font:400 28px var(--f-display);color:var(--marker)}
.panel .sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.st{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.st .ink{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid #4c5964;transform:rotate(-10deg)}
.st.got .ink{border-color:var(--marker);background:radial-gradient(circle,rgba(255,138,31,.35),transparent 70%)}
.st b{display:block;font:800 13px/1.2 var(--f-ui)}
.st span{display:block;font:400 12px/1.35 var(--f-ui);color:var(--muted);margin-top:2px}
.alm{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:90px 1fr;gap:12px}
.alm .y{font:700 13px var(--f-mono);color:var(--marker)}
.alm b{font:800 14px var(--f-ui);text-transform:uppercase;letter-spacing:.04em}
.alm p{margin:4px 0 0;font:400 14px/1.5 var(--f-ui);color:#d8d2c4;max-width:62ch}
.alm.lock b,.alm.lock p{color:#5e6a73}
table.ctl{width:100%;border-collapse:collapse;font-size:14px}
table.ctl td,table.ctl th{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.ctl th{font:800 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.join{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(640px,calc(100vw - 32px))}
.slot{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.slot.ok{border-style:solid}
.slot .pn{font:400 22px var(--f-display)}
#bigmap{position:absolute;inset:0;z-index:9;background:#0d2b3c}
#bigmap canvas{position:absolute;inset:0;width:100%;height:100%}
#bigmap .legend{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font:600 13px var(--f-ui);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 8px}
#bigmap .legend .chip{font-size:13px;padding:3px 10px 3px 4px}
#bigmap .legend .lnote{flex-basis:100%;text-align:center;color:var(--muted);font-weight:500;font-size:12px}
#loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:var(--asphalt)}
#loading .lg{font:400 clamp(40px,8vw,84px)/1 var(--f-display);text-align:center}
#loading .lg span{color:var(--marker)}
#loading .pr{margin-top:18px;font:600 15px var(--f-ui);color:var(--muted);text-align:center}
#loading .bar{width:min(360px,80vw);height:6px;border-radius:3px;background:#26313b;margin:12px auto 0;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--marker);transition:width .2s}
#padtest{font:600 13px var(--f-mono);display:grid;grid-template-columns:1fr 1fr;gap:12px}
#padtest canvas{width:150px;height:150px;border:1px solid var(--line);border-radius:50%;background:#0f1418}
.note{font:400 13px/1.5 var(--f-ui);color:var(--muted);max-width:62ch}
.phud.compact .loc,.phud.compact .mini,.phud.compact .obj,.phud.compact .money,.phud.compact .arrow,.phud.compact .banner,.phud.compact .big{display:none!important}
.phud.compact .gauge{right:auto;left:214px}
.phud.compact .prompt{bottom:72px}
[hidden]{display:none!important}
.phud .dark{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:6;transition:opacity .6s}
#flash{position:absolute;inset:0;background:#eef2ff;opacity:0;pointer-events:none;z-index:5}
.logo{letter-spacing:.04em}
.phud .card.tribe{background:#3a4a2a}.phud .card.who{background:#26384f}
@media (max-width:700px){.phud .prompt{max-width:calc(100% - 40px);bottom:200px}.phud .mini{width:120px;height:120px}.join{grid-template-columns:1fr}}
.padst{display:flex;align-items:flex-start;gap:9px;max-width:min(560px,calc(100vw - 32px));margin:0;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:600 14px/1.45 var(--f-ui);color:var(--paper)}
.padst .dot{flex:none;width:10px;height:10px;margin-top:5px;border-radius:50%;background:var(--marker);box-shadow:0 0 0 3px rgba(255,138,31,.25)}
.padst .dot.ok{background:#5bd18a;box-shadow:0 0 0 3px rgba(91,209,138,.25)}
.padtest{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.padtest canvas{width:min(220px,100%);height:auto;display:block;margin:8px 0}
.padtest .tag2{font:700 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--marker)}
.padtest .pbtn{font:600 14px var(--f-ui)}
.padtest .pbtn b{display:inline-block;min-width:22px;padding:1px 6px;margin:2px 2px 0 0;border-radius:6px;background:var(--sign);color:#fff;text-align:center}
.padtest .praw{font:500 11px/1.5 var(--f-mono);color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.phud .vit{position:absolute;left:14px;bottom:200px;display:flex;flex-direction:column;gap:5px;text-shadow:0 1px 3px #000}
.phud .vit .hpb{width:176px;height:12px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);overflow:hidden}
.phud .vit .hpb span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b0202a,#ff5c5c);transition:width .15s}
.phud .vit .wp{font:700 13px var(--f-ui);color:var(--paper)}
.phud .hurt{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(170,0,0,.8) 100%)}
#app.past #gl{filter:sepia(.85) contrast(1.08) brightness(.92)}
#dialog .txt{white-space:pre-line}
.wz{min-height:96px;display:flex;flex-direction:column;justify-content:center}
.wzq{font:800 22px/1.3 var(--f-ui);margin:0 0 6px;text-wrap:balance}
.phud .chip.urgent{background:#7a1f1f;border-color:#ff5c5c;animation:urgent 0.9s ease-in-out infinite}
@keyframes urgent{50%{box-shadow:0 0 0 4px rgba(255,92,92,.45)}}
@media (prefers-reduced-motion:reduce){.phud .chip.urgent{animation:none}}
#bigmap canvas{cursor:crosshair}
@media (max-height:600px){.menu{gap:12px;padding-block:12px}.logo{font-size:clamp(32px,8vh,60px)}.tag{font-size:13px}.mi{padding:6px 14px;font-size:14px}.mlist{gap:6px}}
</style>
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="Haunted Atlas game view"></canvas>
  <div id="divider" hidden></div><div id="flash"></div><div id="fade"></div>
  <div id="hudlayer"></div>
  <div id="stamps" aria-live="polite"></div>
  <div id="dialog" hidden><div class="who"></div><div class="txt"></div><div class="opts"></div><div class="go"></div></div>
  <div id="bigmap" hidden><canvas></canvas><div class="legend"></div></div>
  <div id="ui" class="overlay clear" hidden></div>
  <div id="loading"><div><div class="lg">HAUNTED <span>ATLAS</span></div><div class="pr" id="ldtxt">Lighting the jack-o'-lanterns…</div><div class="bar"><i id="ldbar"></i></div></div></div>
</div>
<script type="module">
/* =====================================================================
   HAUNTED ATLAS — a top-down Halloween adventure for one or two players
   ---------------------------------------------------------------------
   Notes for agents extending this game
   - World units are metres. World x runs east, world y runs NORTH,
     z is up. The map is W x H metres (4800 x 3600): the Atlantic seaboard
     from Georgia to New Hampshire, with the frontier to the west.
   - Everything about the map lives in data near the top of the file:
     MAINLAND (coast polygon), LAND_CAPS / WATER_CAPS (islands, bays),
     REGIONS (colonies as nearest-seed areas with river borders), RIVERS
     (levels found automatically), LAKES, CITIES, ROADS, RAIL_CTL (the stage
     wagon loop), TRIBES, FIGURES (Who's Who), LANDMARKS, VSPAWNS,
     MISSIONS, ACH (achievements) and EGGS (secrets).
   - Terrain is a heightfield (4 m cells) carved by rivers, the canal,
     lakes and roads at boot. heightAt(), waterAt(), groundAt() are the
     queries physics uses.
   - Players read input through readControls(); the dead-zone and
     response-curve rules live in the INPUT section.
   - GA (window.GA) exposes act-like hooks for testing from the console.
   ===================================================================== */
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

// ---------- math ----------
const W = 4800, H = 3600, CS = 5, GX = W / CS + 1, GY = H / CS + 1, NG = GX * GY;
const PI = Math.PI, TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));

  out.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); out.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  return out;
}

const HISTORY = {
  // ----- the village -----
  hollow: { title: 'Hollow\'s End', year: 'Today', text: 'Hollow\'s End sits between the monster lands to the south and west and the killers\' cities to the north and east. Its walls, lanterns and great ward fire keep the night away, mostly. Rest, trade and take on cases here.' },
  gettysburg: { title: 'Gettysburg', year: '1863', text: 'In July 1863 the largest battle of the Civil War was fought around this Pennsylvania town, with more than 50,000 soldiers killed, wounded, captured or missing in three days. Many visitors call it one of the most haunted places in America.' },
  // ----- West Virginia and the Appalachian Hollows -----
  mothman: { title: 'The Mothman', year: '1966', text: 'Point Pleasant, West Virginia. On November 15, 1966, two young couples driving near the old TNT plant north of town reported a tall winged figure with glowing red eyes that chased their car. More than 100 people reported sightings over the next year. Some scientists suggested a large bird such as a sandhill crane. Today the town has a shiny metal Mothman statue and a Mothman Festival every September.' },
  tnt: { title: 'The TNT Area', year: '1942', text: 'During World War II the West Virginia Ordnance Works made explosives here. When it closed, it left behind dozens of concrete storage "igloos" half-buried in the woods. They became the spot where Mothman was most often reported.' },
  silverbridge: { title: 'The Silver Bridge', year: '1967', text: 'On December 15, 1967, the Silver Bridge between Point Pleasant and Ohio collapsed at rush hour and 46 people died. Investigators traced the collapse to one small crack in a single steel eyebar. Legends later tied Mothman to the disaster, but the cause was a flaw in the steel. The tragedy led to national bridge-inspection rules.' },
  flatwoods: { title: 'The Flatwoods Monster', year: '1952', text: 'Flatwoods, West Virginia, September 12, 1952. A group of boys saw a bright light cross the sky and land on a hilltop farm. With Kathleen May and others, they climbed the hill and reported a 10-foot figure with a spade-shaped hood, a glowing face and a choking, metallic mist. Investigators later suggested a meteor, a barn owl in a tree, and a flashing aircraft beacon. Today Braxton County celebrates its monster with giant monster-shaped chairs around town.' },
  moundsville: { title: 'West Virginia Penitentiary', year: '1876', text: 'Moundsville, West Virginia. This Gothic stone prison opened in 1876 and held prisoners until 1995. Its dark cell blocks are now a museum known for nighttime ghost tours.' },
  transallegheny: { title: 'Trans-Allegheny Lunatic Asylum', year: '1864', text: 'Weston, West Virginia. One of the largest hand-cut stone buildings in North America, it took its first patients in 1864. It was designed for about 250 people, but by the 1950s more than 2,000 were crowded inside. It closed in 1994 and is now known for its history tours and ghost tours.' },
  bellwitch: { title: 'The Bell Witch', year: '1817', text: 'Adams, Tennessee, 1817 to 1821. The Bell family said an invisible spirit knocked on their walls, pulled off their blankets and even spoke. Legend says future president Andrew Jackson visited, and his wagon stuck fast until a voice let it go. It is one of the most famous ghost stories in America. A cave on the old Bell farm is open to visitors.' },
  benders: { title: 'The Bloody Benders', year: '1873', text: 'Labette County, Kansas, far out on the prairie. From 1871 to 1873 the Bender family ran a small inn and store on a trail. Travelers who stopped there disappeared. When searchers dug up the property in 1873, they found the remains of at least ten people, but the family had already fled. They were never found.' },
  // ----- Virginia, Maryland and the Carolinas -----
  bunnyman: { title: 'Bunny Man Bridge', year: '1970', text: 'Colchester Overpass, Clifton, Virginia. In October 1970, two reports in Fairfax County described a man in a white suit with rabbit ears: one couple said he threw a hatchet through their car window, and a guard said he hacked at a porch post with an axe. He was never caught. Over the years the story grew into a ghost legend about this one-lane railroad tunnel, which draws crowds on Halloween.' },
  poe: { title: 'Poe\'s Grave', year: '1849', text: 'Westminster Burying Ground, Baltimore. Edgar Allan Poe, author of "The Raven" and "The Tell-Tale Heart," died in Baltimore in 1849 after being found confused and in someone else\'s clothes. Nobody knows exactly why he died. From 1949 to 2009, a mystery visitor called the "Poe Toaster" left three roses and a bottle of cognac at his grave every year on his birthday.' },
  snallygaster: { title: 'The Snallygaster', year: '1909', text: 'Frederick County, Maryland. German settlers in the 1700s told of the "Schneller Geist," a quick spirit. In 1909, local newspapers reported sightings of a huge winged beast with a long beak. Legend says seven-pointed stars painted on barns kept it away.' },
  lizardman: { title: 'The Lizard Man', year: '1988', text: 'Scape Ore Swamp near Bishopville, South Carolina. In June 1988, 17-year-old Christopher Davis said a seven-foot green creature with red eyes and three fingers on each hand jumped on his car after he stopped to change a tire near midnight. Dozens more reports came in that summer and the story went national.' },
  charlestonjail: { title: 'Old Charleston Jail', year: '1802', text: 'Charleston, South Carolina. This castle-like jail held prisoners from 1802 to 1939. Legend calls Lavinia Fisher, held here, "America\'s first female serial killer," but records show she and her husband were hanged in 1820 for highway robbery. No murder was ever proven.' },
  roanoke: { title: 'The Lost Colony', year: '1587', text: 'Roanoke Island, North Carolina. In 1587 about 115 English colonists settled here, and Virginia Dare became the first English child born in the Americas. When John White returned in 1590, every one of them was gone. The only clue was the word CROATOAN carved on a post.' },
  // ----- Georgia -----
  bonaventure: { title: 'Bonaventure Cemetery', year: '1846', text: 'Savannah, Georgia. Live oaks hung with Spanish moss shade this Victorian cemetery beside the Wilmington River. Savannah is often called one of America\'s most haunted cities, partly because the town was built over old burial grounds.' },
  skunkape: { title: 'The Skunk Ape', year: 'Legend', text: 'People have reported a big, hairy, ape-like creature in the swamps of Florida and southern Georgia for decades. It gets its name from the horrible smell witnesses describe. No body or bones have ever been found.' },
  // ----- Pine Barrens and New York -----
  leeds: { title: 'Leeds Point', year: '1735', text: 'Legend says that in 1735 Mother Leeds of Leeds Point, poor and worn out, had her thirteenth child and cried out that this one could be the Devil. The baby is said to have turned into a winged creature with a horse\'s head and flown up the chimney into the Pine Barrens. In January 1909, hundreds of people across New Jersey and Pennsylvania reported strange tracks and sightings.' },
  pinebarrens: { title: 'The Pine Barrens', year: 'New Jersey', text: 'More than a million acres of sandy soil and pitch pines. For three hundred years, people who live here have told stories of the Jersey Devil shrieking in the dark.' },
  sleepyhollow: { title: 'Old Dutch Church', year: '1685', text: 'Sleepy Hollow, New York. This church was built around 1685. In 1820 Washington Irving set his spooky tale of the Headless Horseman here; the horseman was said to be the ghost of a soldier who lost his head to a cannonball.' },
  // ----- Pennsylvania (killers) -----
  easternstate: { title: 'Eastern State Penitentiary', year: '1829', text: 'Philadelphia. Opened in 1829, its cell blocks spread out from a center hub like spokes on a wheel, and prisoners were kept alone so they would reflect and repent. Al Capone spent 1929 to 1930 here, in a cell with rugs and a radio. It closed in 1971 and is now a museum famous for its Halloween event.' },
  moyamensing: { title: 'Moyamensing Prison', year: '1896', text: 'Philadelphia. H. H. Holmes (real name Herman Mudgett) was hanged here on May 7, 1896. He was convicted of murdering his business partner Benjamin Pitezel as part of an insurance scheme, and he confessed to many more killings. In Chicago he had built a strange building that newspapers called the "Murder Castle." Historians think many of the wildest stories about it were exaggerated.' },
  holmesboston: { title: 'Holmes Caught', year: '1894', text: 'On November 17, 1894, Pinkerton detectives who had been trailing H. H. Holmes arrested him in Boston for insurance fraud. Philadelphia detective Frank Geyer then followed Holmes\'s path across the country and uncovered the truth.' },
  kelpius: { title: 'Hermits of the Wissahickon', year: '1694', text: 'In 1694 Johannes Kelpius led about 40 German mystics to Wissahickon Creek. Believing the world might end soon, they watched the night sky with a telescope. A small cave in these woods still carries his name.' },
  hellfire: { title: 'The Hellfire Club', year: '1750s', text: 'The Hellfire Club was a secret society of English gentlemen that met in caves dug beneath West Wycombe, England, in the 1750s and 1760s. Its motto was "Fay ce que voudras," meaning "Do what you will." Benjamin Franklin stayed with its founder, Sir Francis Dashwood, in 1772. Whether he ever attended a meeting is still a mystery.' },
  // ----- New England (killers) -----
  lizzie: { title: 'The Borden House', year: '1892', text: 'Fall River, Massachusetts. On August 4, 1892, Andrew and Abby Borden were killed with a hatchet in this house. Andrew\'s daughter Lizzie was arrested and put on trial, but in June 1893 the jury found her not guilty. No one else was ever charged. The house is now a museum and bed and breakfast.' },
  salem: { title: 'Salem, 1692', text: 'In 1692 fear of witchcraft swept Salem Village. More than 200 people were accused and 20 innocent people were executed. Courts accepted "spectral evidence," claims that a person\'s spirit had attacked someone in a dream or vision. Massachusetts later apologized.', year: '1692' },
  conscience: { title: 'Cases of Conscience', year: '1692', text: 'In October 1692, minister Increase Mather argued that spectral evidence should not be trusted, writing that it was better for ten suspected witches to escape than for one innocent person to be condemned. Governor William Phips shut down the special witch court that same month.' },
  doverdemon: { title: 'The Dover Demon', year: '1977', text: 'Dover, Massachusetts. On April 21, 1977, 17-year-old Bill Bartlett said he saw a small, pale creature with a huge watermelon-shaped head and glowing orange eyes crawling along a stone wall. Over the next day, two more teenagers reported seeing it. It has never been explained.' },
  // ----- Old London, on the Isle of Fog -----
  whitechapel: { title: 'Whitechapel, 1888', year: '1888', text: 'Whitechapel, in the poor East End of London. Between August and November 1888, five women were murdered here: Mary Ann Nichols, Annie Chapman, Elizabeth Stride, Catherine Eddowes and Mary Jane Kelly. The killer was never caught. Newspapers called him "Jack the Ripper," a name from a letter that many historians think a journalist wrote as a hoax.' },
  fromhell: { title: 'From Hell', year: '1888', text: 'In October 1888, George Lusk, head of the Whitechapel Vigilance Committee, received a small box with a letter headed "From Hell." Police got hundreds of letters during the case. Historians still argue over whether any of them came from the real killer.' },
  tower: { title: 'The Tower of London', year: '1078', text: 'William the Conqueror began the White Tower around 1078. The Tower was a royal palace, a fortress and a prison. Anne Boleyn, a wife of King Henry VIII, was beheaded here in 1536, and legend says her ghost still walks the grounds.' },
  sweeney: { title: 'Fleet Street', year: '1846', text: 'Sweeney Todd, "the Demon Barber of Fleet Street," first appeared in a cheap "penny dreadful" story called The String of Pearls in 1846 and 1847. There is no good evidence he was a real person. He is a legend that became a famous play and musical.' },
  burkehare: { title: 'Burke and Hare', year: '1828', text: 'Edinburgh, Scotland. In the narrow closes of the Old Town in 1828 William Burke and William Hare killed 16 people and sold the bodies to an anatomy school for doctors. Hare testified against Burke in exchange for his freedom, and Burke was hanged in 1829. The case led to Britain\'s Anatomy Act of 1832.' },
  ferry: { title: 'The Night Ferry', year: 'Crossing', text: 'Old London lies across the sea on the Isle of Fog. If you\'d rather not sail, the ferryman at this pier will take you across.' },
  bran: { title: 'Bran Castle', year: '1388', text: 'Transylvania, Romania. Merchants from nearby Brasov built this castle on a rocky cliff around 1388 to guard a mountain pass. Today it is sold to tourists as "Dracula\'s Castle." Bram Stoker\'s novel Dracula (1897) made the vampire count famous, but Stoker never visited Romania. He borrowed the name from Vlad III "Dracula," a real prince of nearby Wallachia in the 1400s, famous for brutal punishments of his enemies. Historians find little evidence that Vlad ever lived here.' },
  strigoi: { title: 'The Strigoi', year: 'Folklore', text: 'In Romanian folklore a strigoi is a restless spirit that rises from its grave at night. Villagers used garlic, holy water and even special burial customs to keep strigoi away. These old stories helped inspire the vampire legends of the 1800s.' },
  khumjung: { title: 'Khumjung Monastery', year: '1960', text: 'Khumbu region, Nepal, in the shadow of Mount Everest. This Buddhist monastery kept a pointed "Yeti scalp" for generations. In 1960 Sir Edmund Hillary, one of the first two people to climb Everest, borrowed it for scientists to study. Tests showed it was made from the skin of a serow, a Himalayan goat-antelope.' },
  yeti: { title: 'The Yeti', year: '1951', text: 'Sherpa stories tell of the yeti, a hairy creature of the high snows. In 1951 mountaineer Eric Shipton photographed a huge footprint near the Menlung Glacier, and newspapers named the creature the "Abominable Snowman." In 2017 scientists tested hair, bone and other "yeti" samples from museums and monasteries. Nearly all came from Himalayan bears, and one came from a dog.' },
  lochness: { title: 'Loch Ness', year: '1933', text: 'Scottish Highlands. Loch Ness is about 37 km long and more than 220 m deep, and it holds more fresh water than all the lakes of England and Wales put together. A story from the year 565 tells of Saint Columba driving off a "water beast" in the River Ness. The modern legend began in 1933, when a new road opened along the shore and sightings flooded in. The famous 1934 "Surgeon\'s Photograph" of a long neck turned out, in 1994, to be a toy submarine with a model head. In 2018 scientists sampled the loch\'s DNA and found no sign of a giant reptile, but a surprising amount of eel DNA.' },
  urquhart: { title: 'Urquhart Castle', year: '1200s', text: 'The ruins of Urquhart Castle stand on the shore of Loch Ness. The castle was fought over during Scotland\'s wars of independence and was blown up in 1692 so enemies could not use it. More "Nessie" sightings have been reported from here than almost anywhere else on the loch.' },
  kelpie: { title: 'The Kelpie', year: 'Folklore', text: 'Scottish folklore warns of the kelpie, a shape-shifting water spirit that appears as a beautiful horse beside a loch or river. Anyone who climbs on its back sticks fast, and the kelpie gallops into the water. Parents told the story to keep children away from dangerous deep water.' },
  leith: { title: 'Leith Harbour', year: 'Edinburgh', text: 'Leith is Edinburgh\'s port on the Firth of Forth. For centuries ships from all over Europe docked here, and it was the mainland gateway to the Highlands and islands.' },
  chupacabra: { title: 'The Chupacabra', year: '1995', text: 'Canovanas, Puerto Rico. In 1995 farmers found goats and chickens dead with small puncture wounds, and Madelyne Tolentino described a spiky, big-eyed creature walking on two legs. People called it the chupacabra, Spanish for "goat-sucker." Researcher Benjamin Radford later pointed out that her description looked a lot like the alien in the movie Species, released that summer. Later "chupacabras" found in Texas and Mexico usually turned out to be coyotes or dogs with mange, a skin disease that makes fur fall out.' },
  elyunque: { title: 'El Yunque', year: 'Puerto Rico', text: 'El Yunque is the only tropical rainforest in the U.S. National Forest System. Its misty peaks are home to the tiny coqui frog, whose two-note "ko-KEE" call fills the night.' },
  whitecity: { title: 'The White City', year: '1893', text: 'Chicago, 1893. The World\'s Columbian Exposition drew about 27 million visitors to gleaming white buildings lit by electric lights. It introduced the world\'s first Ferris wheel, 80 m tall, built by engineer George Ferris to rival Paris\'s Eiffel Tower.' },
  castle: { title: 'The World\'s Fair Hotel', year: '1893', text: 'Englewood, Chicago. H. H. Holmes built a three-story building here, with shops below and rooms above, and rented rooms to visitors coming to the World\'s Fair. After his arrest, newspapers called it the "Murder Castle" and told wild stories of secret passages. Historians think many of those stories were exaggerated to sell papers. It burned in 1895, and a post office stands on the site today.' },
  cachtice: { title: 'Cachtice Castle', year: '1610', text: 'Kingdom of Hungary (today Slovakia). In 1610 Countess Elizabeth Bathory, one of the richest nobles in the kingdom, was arrested and accused of killing many young servant women. She was never put on trial; she was shut inside this castle until her death in 1614, and several of her servants were executed. The legend that she bathed in blood first appeared more than 100 years later with no evidence. Some historians think her powerful enemies, who owed her family money, exaggerated the case.' },

// ---------- mission helpers: Jersey Devil ----------
function jdStart() { if (!JD.m) { JD.m = makeDevil(); scene.add(JD.m); } JD.m.visible = true; const c = LEEDS.chim; JD.m.position.set(c[0], c[1], c[2] - 1.5); JD.t = 0; sfx('thunder', 1); WEATHER.flash = 1; }
function jdFlap(dt, fast = true) { JD.t += dt; for (const w of JD.m.userData.wings) w.pv.rotation.x = w.sd * (0.3 + Math.sin(JD.t * (fast ? 14 : 3)) * (fast ? 0.7 : 0.15)); }
function jdRise(st, dt) { const c = LEEDS.chim, p = LEEDS.perch, t = st.t; jdFlap(dt); if (t < 2) JD.m.position.set(c[0], c[1], c[2] - 1.5 + t * 1.8); else { const u = sstep(2, 6.5, t); JD.m.position.set(lerp(c[0], c[0] - 80, u), lerp(c[1], c[1] + 90, u), c[2] + 2 + Math.sin(u * PI) * 20); JD.m.rotation.z = Math.atan2(90, -80); } if (t > 1.9 && !st.scr) { st.scr = true; sfx('screech', 1); for (const q of PLAYERS) if (q.active) { rumble(q, 0.6, 0.9, 400); q.cam.trauma = 0.6; } } if (t > 6.5) JD.m.visible = false; }
function jdPerch(at) { JD.m.visible = true; JD.m.position.set(at[0], at[1], heightAt(at[0], at[1]) + 7); JD.t = 0; }
function jdIdle(st, dt) { jdFlap(dt, false); if (Math.random() < 0.004) sfx('screech', 0.6, JD.m.position); }
function jdChaseStart() { const P = [[1700, 2142], [1722, 2102], [1736, 2060], [1746, 2020], [1776, 1990], [1840, 1970], [1910, 1950]]; JD.path = new Path(catmull(P, 6)); JD.s = 0; sfx('screech', 1); }
function jdChase(st, dt) {
  jdFlap(dt);
  let near = 1e9; for (const p of PLAYERS) if (p.active) near = Math.min(near, hyp(posOf(p).x - JD.m.position.x, posOf(p).y - JD.m.position.y));
  JD.s += dt * (near < 25 ? 11 : near < 60 ? 7 : 3.5);
  const a = JD.path.at(JD.s); JD.m.position.set(a.x, a.y, Math.max(heightAt(a.x, a.y), 0) + 8 + Math.sin(JD.t * 2) * 1.5); JD.m.rotation.z = Math.atan2(a.ty, a.tx);
  if (Math.random() < 0.01) sfx('screech', 0.8, JD.m.position);
  if (near > 140 && st.t > 4) missionFail('It vanished into the fog. Stay closer!');
}
function jdEnd() { if (JD.m) JD.m.visible = false; }
// ---------- the Starving Time ----------
function starveStart() {
  STARVE.alive = 500; STARVE.t = 0; STARVE.tradeT = 0; for (const p of PLAYERS) p.carry = 0;
  for (const n of STARVE.nodes) scene.remove(n.m); STARVE.nodes.length = 0;
  const node = (x, y, kind, boat) => { const z = Math.max(heightAt(x, y), waterAt(x, y)); const g = new GB(); if (kind === 'oyster') for (let i = 0; i < 5; i++) g.sphere(0.35, (i % 3) * 0.6 - 0.6, Math.floor(i / 3) * 0.6, 0.1, C(0.62, 0.62, 0.58), 6, 4, 0.4); else g.add(new THREE.TorusGeometry(2.2, 0.15, 6, 20), C(1, 0.85, 0.4), 0, 0, 0.2, 0, 0, 0, 1, 1, 1, true); const m = g.mesh(LM_MAT, false); m.position.set(x, y, z); scene.add(m); STARVE.nodes.push({ x, y, kind, boat, m, ready: 0 }); };
  for (const [x, y] of [[2500, 1693], [2585, 1660], [2470, 1703], [2615, 1650]]) node(x, y, 'oyster');
  for (const [x, y] of [[2520, 1662], [2575, 1640], [2470, 1682], [2620, 1622]]) node(x, y, 'fish', true);
}
function starveTarget() {
  const p = PLAYERS.find(q => q.active); if (!p) return null; const q = posOf(p);
  if ((p.carry || 0) >= (p.veh ? 4 : 2)) return [JT.store[0], JT.store[1]];
  const boat = p.veh && p.veh.model === 'boat'; let best = null, bd = 1e9; for (const n of STARVE.nodes) if (n.ready <= 0 && (!n.boat || boat)) { const d = hyp(q.x - n.x, q.y - n.y); if (d < bd) { bd = d; best = n; } } return best ? [best.x, best.y] : [JT.store[0], JT.store[1]];
}
function starveTick(st, dt) {
  STARVE.t = st.t; STARVE.alive = Math.max(1, STARVE.alive - 2.0 * dt); STARVE.tradeT -= dt;
  const mi = Math.min(STARVE.months.length - 1, Math.floor(STARVE.t / STARVE.dur * STARVE.months.length));
  for (const n of STARVE.nodes) { n.ready -= dt; n.m.visible = n.ready <= 0; if (n.kind === 'fish' && n.ready <= 0 && Math.random() < 0.02) splashAt(n.x + fr(-1, 1), n.y + fr(-1, 1), waterAt(n.x, n.y), 0.4); }
  for (const p of PLAYERS) {
    if (!p.active) continue; const q = posOf(p); p.carry = p.carry || 0; const cap = p.veh ? 4 : 2;
    for (const n of STARVE.nodes) if (n.ready <= 0 && p.carry < cap && hyp(q.x - n.x, q.y - n.y) < (n.boat ? 4 : 3) && (!n.boat || (p.veh && p.veh.model === 'boat'))) { p.carry++; n.ready = n.boat ? 35 : 25; sfx('gulp', 0.8); toastP(p, n.kind === 'fish' ? 'You caught a sturgeon!' : 'You gathered oysters.'); }
    const T = TRIBES.find(t => t.id === 'powhatan');
    if (hyp(q.x - T.at[0], q.y - T.at[1]) < 12 && STARVE.tradeT <= 0 && p.carry < cap) { STARVE.tradeT = 45; if (tribeAngry(T) || Math.random() < 0.4) toastP(p, 'The Powhatan refuse to trade this time. Their people are hungry too.'); else { p.carry = Math.min(cap, p.carry + 3); toastP(p, 'The Powhatan trade you baskets of corn.'); sfx('coin'); } }
    if (p.carry > 0 && hyp(q.x - JT.store[0], q.y - JT.store[1]) < 7) { STARVE.alive += p.carry * 5; toastP(p, `You brought ${p.carry} food to the storehouse.`); p.carry = 0; sfx('ding'); }
  }
  MS.label = `${STARVE.months[mi]} · Colonists alive: ${Math.round(STARVE.alive)} · Carrying: ${PLAYERS.filter(p => p.active).map(p => p.carry || 0).join(' + ')} food`;
}
function starveEnd() {
  for (const n of STARVE.nodes) scene.remove(n.m); STARVE.nodes.length = 0; for (const p of PLAYERS) p.carry = 0;
  const n = Math.round(STARVE.alive);
  if (n > 60) { achieve('starving'); bigTextAll('You beat history!', `${n} colonists survived. In 1610, only about 60 did.`); }
  else missionFail(`Only ${n} colonists survived, just like the real Starving Time. Try to bring more food.`);
}
// ---------- the cavern ----------
function caveEnter() {
  const [ax, ay] = CAVE.arrive; CAVE.door.open = false; if (CAVE.doorMesh) CAVE.doorMesh.visible = true;
  for (const p of PLAYERS) if (p.active) { if (p.veh) exitVehicle(p); Object.assign(p.char, { x: ax + p.i * 2, y: ay, z: CAVERN.h, vx: 0, vy: 0, vz: 0, grounded: true }); p.cam.snap(p); }
  fadeFlash(); sfx('whoosh', 1);
}
function caveExit() { for (const p of PLAYERS) if (p.active) { if (p.veh) exitVehicle(p); const x = 3170 + p.i * 2, y = 2342; Object.assign(p.char, { x, y, z: groundAt(x, y), vx: 0, vy: 0, vz: 0, grounded: true }); p.cam.snap(p); } fadeFlash(); }
function watcherTick() {
